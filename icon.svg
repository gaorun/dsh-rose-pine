<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Rosé Pine">
  <title>Rosé Pine</title>
  <!-- Tile: Rosé Pine base -->
  <rect width="64" height="64" rx="14" fill="#191724"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#26233a" stroke-width="0.5"/>
  <!-- Pine stem and needles -->
  <g fill="none" stroke-linecap="round">
    <path d="M32 51V36" stroke="#31748f" stroke-width="2.4"/>
    <path d="M31.6 47.4c-3.8-.2-6.8-1.7-8.6-4.3" stroke="#9ccfd8" stroke-width="1.2"/>
    <path d="M32.4 44.6c3.8-.2 6.8-1.7 8.6-4.3" stroke="#9ccfd8" stroke-width="1.2"/>
  </g>
  <path d="M31.8 45.2c-5.4-.6-9-3.2-10.8-7.4 4.9-.6 9 1.5 11.2 5.4z" fill="#31748f"/>
  <path d="M32.2 41.4c5.4-.6 9-3.2 10.8-7.4-4.9-.6-9 1.5-11.2 5.4z" fill="#31748f"/>
  <!-- Rose bloom: five outer petals -->
  <g fill="#ebbcba">
    <ellipse cx="32" cy="16.6" rx="6.2" ry="8.6"/>
    <ellipse cx="32" cy="16.6" rx="6.2" ry="8.6" transform="rotate(72 32 25.2)"/>
    <ellipse cx="32" cy="16.6" rx="6.2" ry="8.6" transform="rotate(144 32 25.2)"/>
    <ellipse cx="32" cy="16.6" rx="6.2" ry="8.6" transform="rotate(216 32 25.2)"/>
    <ellipse cx="32" cy="16.6" rx="6.2" ry="8.6" transform="rotate(288 32 25.2)"/>
  </g>
  <!-- Inner petals, rotated half a step -->
  <g fill="#ea9a97">
    <ellipse cx="32" cy="20.4" rx="4.1" ry="5.6" transform="rotate(36 32 25.2)"/>
    <ellipse cx="32" cy="20.4" rx="4.1" ry="5.6" transform="rotate(108 32 25.2)"/>
    <ellipse cx="32" cy="20.4" rx="4.1" ry="5.6" transform="rotate(180 32 25.2)"/>
    <ellipse cx="32" cy="20.4" rx="4.1" ry="5.6" transform="rotate(252 32 25.2)"/>
    <ellipse cx="32" cy="20.4" rx="4.1" ry="5.6" transform="rotate(324 32 25.2)"/>
  </g>
  <!-- Heart of the rose -->
  <circle cx="32" cy="25.2" r="3.4" fill="#eb6f92"/>
  <circle cx="32" cy="25.2" r="1.3" fill="#f6c177"/>
</svg>
